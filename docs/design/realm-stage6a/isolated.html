<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realm supporting artwork review</title><style>body{font:16px Georgia;margin:0;padding:24px;background:#eee8db;color:#3d392f}h1{font-size:24px}.panel{padding:20px;margin:16px 0;background:#faf5e9;border-radius:12px}.dark{background:#252e29;color:#eee8db}.row{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.item{text-align:center;width:150px}.large{width:96px;height:96px;object-fit:contain}.sizes{display:flex;justify-content:center;gap:14px;align-items:center;margin-top:12px}.sizes img{object-fit:contain}.portrait{width:150px;height:150px;object-fit:contain}.checker{background:conic-gradient(#ddd 25%,#fff 0 50%,#ddd 0 75%,#fff 0);background-size:16px 16px}</style><h1>The Realm — supporting artwork</h1><p>Resource icons at 96px, 24px and 32px · Wayfinder at 150px and 60px</p><div id="review"></div><script>
for(const theme of ['light','dark','checker']){const section=document.createElement('section');section.className='panel '+theme;const row=document.createElement('div');row.className='row';for(const name of ['wood','stone','food','coins','iron','wayfinder']){const item=document.createElement('div');item.className='item';item.innerHTML=`<img class="${name==='wayfinder'?'portrait':'large'}" src="assets/${name}.webp" alt="${name}"><div>${name}</div><div class="sizes">${(name==='wayfinder'?[60]:[24,32]).map(n=>`<img src="assets/${name}.webp" alt="" width="${n}" height="${n}">`).join('')}</div>`;row.append(item)}section.append(row);document.querySelector('#review').append(section)}
</script></html>
