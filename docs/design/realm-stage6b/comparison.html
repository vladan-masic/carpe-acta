<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realm exploration artwork</title><style>body{margin:24px;background:#f5eedf;color:#403c31;font:18px Georgia}main{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}figure{margin:0}img{display:block;width:100%;height:auto;border-radius:8px}figcaption{padding:10px 0}h1{font-size:28px}</style><h1>The Realm — Exploration artwork</h1><main id="scenes"></main><script>for(const [id,title] of Object.entries({woods:'The Whispering Woods',meadow:'Quiet Meadow',river:'River Landing',ridge:'Slate Ridge',orchard:'Old Orchard',pass:'Mountain Pass'})){const f=document.createElement('figure');f.innerHTML=`<img src="assets/${id}-800.webp" alt="${title}"><figcaption>${title}</figcaption>`;document.querySelector('main').append(f)}</script></html>
